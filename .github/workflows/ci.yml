name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder

      - name: Known vulnerable dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hh
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply the schema twice, to prove it is repeatable
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d hh -v ON_ERROR_STOP=1 -q \
            -f supabase/testing/supabase-stub.sql
          psql -h localhost -U postgres -d hh -v ON_ERROR_STOP=1 -q \
            -f supabase/schema.sql
          psql -h localhost -U postgres -d hh -v ON_ERROR_STOP=1 -q \
            -f supabase/schema.sql

      - name: Security tests
        env:
          PGPASSWORD: test
        run: |
          out=$(psql -h localhost -U postgres -d hh -q \
            -f supabase/security-tests.sql 2>&1)
          echo "$out"
          if echo "$out" | grep -q "FAIL"; then
            echo "::error::A security assertion failed"
            exit 1
          fi
